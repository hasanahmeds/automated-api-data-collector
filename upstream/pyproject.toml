[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-pipeline-etl"
version = "1.1.0"
description = "Config-driven ETL & data-governance pipeline: multi-source ingestion, cleaning rules, quality gates, idempotent loading, lineage."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Data Platform Team" }]
keywords = ["etl", "data-engineering", "data-governance", "pipeline", "pandas", "sqlalchemy", "fastapi", "airflow"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
    "Framework :: FastAPI",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "sqlalchemy>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
parquet = ["pyarrow>=15.0"]
postgres = ["psycopg[binary]>=3.1"]
airflow = ["apache-airflow>=2.9"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "black>=24.4",
    "types-PyYAML>=6.0",
]

[project.scripts]
data-pipeline-etl = "src.cli:main"

[project.urls]
Documentation = "https://github.com/data-platform/data-pipeline-etl#readme"
Source = "https://github.com/data-platform/data-pipeline-etl"
Issues = "https://github.com/data-platform/data-pipeline-etl/issues"

[tool.setuptools.packages.find]
include = ["src*"]

# --------------------------------------------------------------------------- #
# Testing
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --cov=src --cov-report=term-missing"
markers = [
    "integration: marks tests that touch real IO (DB, files).",
]

# --------------------------------------------------------------------------- #
# Linting / formatting (ruff, black, mypy)
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["data", "notebooks"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "C4",   # comprehensions
    "SIM",  # simplify
    "N",    # pep8-naming
]
ignore = [
    "E501",  # line length handled by black
    "B008",  # function call in default argument (FastAPI deps)
    "B904",  # raise from in re-raise (we use it deliberately sometimes)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # asserts are fine in tests
"src/api/*" = ["B008"]  # FastAPI deps

[tool.ruff.lint.isort]
known-first-party = ["src"]
force-sort-within-sections = true

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
  | data
)/
'''

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = false  # would be a follow-up to enable
check_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "data/",
    "build/",
    "dist/",
]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "airflow.*"
ignore_missing_imports = true

# --------------------------------------------------------------------------- #
# Coverage
# --------------------------------------------------------------------------- #
[tool.coverage.run]
source = ["src"]
branch = true
omit = ["src/orchestration/airflow_dag.py", "tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
